name: logger

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 228:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y make valgrind cmake postgresql-client
      - name: Install gtest manually
        run: sudo apt-get install -y libgtest-dev && cd /usr/src/gtest && sudo cmake CMakeLists.txt && sudo make && sudo cp lib/*.a /usr/lib && sudo ln -s /usr/lib/libgtest.a /usr/local/lib/libgtest.a && sudo ln -s /usr/lib/libgtest_main.a /usr/local/lib/libgtest_main.a
      - uses: actions/checkout@v3
      - name: build
        run: mkdir -p build/test && mv test/*.toml build/test/ && cd build && cmake .. && cmake --build . --config Release && cd test && cmake --build . --config Release
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h 127.0.0.1 -p 228 -U postgres; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL..."
            sleep 5
          done
          exit 1
      - name: test of LogPostgresql
        run: cd build/test && ./tests
      - name: test of memory of LogPostgresql
        run: cd build/test && valgrind --tool=memcheck --leak-check=full --undef-value-errors=no --error-exitcode=111 ./tests
  apple:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y make valgrind cmake postgresql-client
      - name: Install and start PostgreSQL manually on macOS
        run: |
          brew install postgresql@14
          brew link postgresql@14 --force
          initdb -D /usr/local/var/postgres
          pg_ctl -D /usr/local/var/postgres -o "-p 228" -l /usr/local/var/postgres/server.log start
          sleep 5
          createdb -p 228 testdb
          psql -p 228 -c "CREATE USER postgres WITH PASSWORD 'postgres';"
          psql -p 228 -c "ALTER ROLE postgres WITH SUPERUSER;"
      - name: Install gtest manually
        run: sudo apt-get install -y libgtest-dev && cd /usr/src/gtest && sudo cmake CMakeLists.txt && sudo make && sudo cp lib/*.a /usr/lib && sudo ln -s /usr/lib/libgtest.a /usr/local/lib/libgtest.a && sudo ln -s /usr/lib/libgtest_main.a /usr/local/lib/libgtest_main.a
      - uses: actions/checkout@v3
      - name: build
        run: mkdir -p build/test && mv test/*.toml build/test/ && cd build && cmake .. && make && cd test && make
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            if pg_isready -h 127.0.0.1 -p 228 -U postgres; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL..."
            sleep 5
          done
          exit 1
      - name: test of LogPostgresql
        run: cd build/test && ./tests
      - name: test of memory of LogPostgresql
        run: cd build/test && valgrind --tool=memcheck --leak-check=full --undef-value-errors=no --error-exitcode=111 ./tests
  windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install tools with Chocolatey
        shell: pwsh
        run: |
          choco install -y cmake make postgresql drmemory
          refreshenv

      - name: Add PostgreSQL to PATH
        shell: pwsh
        run: |
          $pgBin = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory | Select-Object -Last 1
          $pgPath = Join-Path $pgBin.FullName 'bin'
          echo "$pgPath" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Init and start PostgreSQL manually
        shell: pwsh
        run: |
          $env:PGDATA = "$env:RUNNER_TEMP\pgdata"
          New-Item -ItemType Directory -Path $env:PGDATA | Out-Null
          
          # Инициализация базы
          initdb -U postgres --pwfile=<(echo postgres) -D $env:PGDATA
          
          # Запуск PostgreSQL в фоне
          pg_ctl -D $env:PGDATA -o "-p 228" -l "$env:RUNNER_TEMP\pg.log" start
          Start-Sleep -Seconds 5
          
          # Проверка, что работает
          psql -U postgres -c "CREATE DATABASE testdb;" -p 228

      - name: Install GoogleTest via vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install gtest
          echo "${{ github.workspace }}\vcpkg" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8 -Force

      - name: Configure and build project
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake -G "MinGW Makefiles"
          cmake --build . --config Release

      - name: Run unit tests
        shell: pwsh
        run: |
          cd build/test
          ./tests.exe

      - name: Run memory check with Dr. Memory
        shell: pwsh
        run: |
          cd build/test
          drmemory --batch --leaks -- ./tests.exe

      - name: Stop PostgreSQL
        if: always()
        shell: pwsh
        run: |
          pg_ctl -D $env:PGDATA stop